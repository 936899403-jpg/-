          <p style="font-size:18px;"><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">1、【更新明细状态】按钮：</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">原匹配发票清单数据与佣金、折扣明细逻辑；——新增若匹配到的【佣金、折扣明细】数据财务类型没取到，则赋值N/A；</span></p><p style="font-size:18px;"><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p style="font-size:18px;"><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 原需求：本需求文档v7.9.2发票清单数据2.2.2</span></p><p style="font-size:18px;"><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p style="font-size:18px;"><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">2、搜索框新增【结算明细状态、折扣/佣金明细状态】：</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">位于是否汇总左侧，下拉多选无默认值，选项分别包括‘未结算、部分结算、结算异常、已结算’和‘未匹配、不存在明细、明细异常、存在明细’；</span></p><p style="font-size:18px;"><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p style="font-size:16px;"><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p>
