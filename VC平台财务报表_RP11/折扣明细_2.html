          <p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">1.导出：</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">【净销售额】、【标价】、【协议折扣】、【含税协议折扣】excel显示保留两位小数；</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">2.【计算汇总】：</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;color:#D9001B;">2.1弹窗新增【报表类型】：下拉多选非必录，选项包括‘月度计提折扣’；</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;color:#D9001B;"><br></span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;color:#D9001B;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp; 2.2计算汇总维度调整为【期间+法人+店铺+站点+部门+币种+报表类型】，生成财务EAS凭证的数据，【数据来源】赋值‘折扣明细’</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">3.列表新增【计提状态】列，位于是否汇总左侧，导出同步调整；</span></p>
