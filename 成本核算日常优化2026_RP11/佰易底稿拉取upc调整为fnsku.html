          <p><span style="font-family:&quot;Arial Negreta&quot;, &quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:700;">【成本核算/</span><span style="font-family:&quot;Arial Negreta&quot;, &quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:700;text-decoration:underline ;">境（国）</span><span style="font-family:&quot;Arial Negreta&quot;, &quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:700;">外成本核算佰易底稿/期末（核算）】：</span></p><p><span style="font-family:&quot;Arial Negreta&quot;, &quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:700;"><br></span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">1.【拉取UPC】按钮名称+列表【UPC】分别改为【拉取FNSKU】和【FNSKU】；</span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">2.原拉取逻辑调整为：点击按钮，筛选【仓库】字段值含“小平台”的数据行，根据当前期间【SKU+店铺(根据仓库在`finance_business_order`.`platform_warehouse`关联warehouse_account_name并获取对应account_name)】，在【调拨明细（汇总）】中关联并获取【单据日期】最新的对应【fnsku】至当前【FNSKU】字段；每次点击后先清空当前期间的【FNSKU】后再匹配；</span></p>
