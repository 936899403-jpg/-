          <p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">1.【不通过】：</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">1.1校验逻辑修改为，按照【店铺+站点+期间+</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;color:#D9001B;">报表类型</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">】维度校验【销售数据】页面对应数据是否汇总至财务EAS凭证（【是否汇总】=‘是’），如已汇总则反审核失败；</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">1.2反审核成功后，对应数据【是否为空】字段值更新为空值；</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">2.【结账】【反结账】：</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">结账、反结账范围需新增预收数据页面对应数据： 下载详情数据结账后，【预收数据】页面不支持拉取 含 对应结账生成时间 上一自然月的预收数据，并给出相应期间已结账提示；反结账后支持拉取；</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p>
