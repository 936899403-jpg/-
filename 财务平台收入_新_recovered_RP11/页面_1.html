          <p><span style="font-family:&quot;Arial Negreta&quot;, &quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:700;">调整匹配逻辑：（红字为本次调整逻辑）</span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">【匹配数据-自发仓库运费（订单匹配）】：点击按钮后，首先根据筛选条件将【转换后的类型】=‘order’（不区分大小写）且订单号不为空的数据，根据【订单号+SKU】在【新自发货/分析统计/销售报表】中关联【平台订单号+平台SKU/SKU】并获取【出库物流费用+</span><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;color:#D9001B;">平台运费(仅限temu平台)</span><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">】的负数值*当前页面汇率 至当前页面【自发仓库运费（订单匹配）】中；未取到则该字段赋‘0’；若匹配到多条数据，则取【</span><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;color:#D9001B;">出库物流费用取最大值+对应平台运费】</span><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">的负数值*汇率；</span></p>
