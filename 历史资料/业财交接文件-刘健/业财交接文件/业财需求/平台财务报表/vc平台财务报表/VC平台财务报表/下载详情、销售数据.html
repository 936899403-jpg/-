          <p style="font-size:18px;"><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">1、下载详情【审核】按钮：</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">解析【月度结算明细】数据时，调整财务类型取值逻辑如下：若未取到财务类型，需赋值‘n/a’；</span></p><p style="font-size:18px;"><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p style="font-size:16px;"><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p>

        <div id="u4634_text" class="text ">
          <p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">2、销售数据 新增【匹配财务类型】按钮：</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">位于计算汇总按钮左侧；</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">2.1鼠标移入，展示提示：匹配发票清单数据的财务类型</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">2.2支持勾选或未勾选按筛选条件匹配。筛选其中【描述】含‘Co-op’的数据，若所筛数据期间已结账或存在【是否汇总】=‘是’的数据则匹配失败并给出相应提示；</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">2.3根据【店铺+站点+发票号】匹配并获取所有期间的发票清单数据月度发票清单的【财务类型】；</span></p>
