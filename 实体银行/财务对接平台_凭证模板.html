          <p style="font-size:20px;"><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;color:#000000;">需求说明：</span></p><p style="font-size:20px;"><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;"><br></span></p><p style="font-size:18px;"><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">【来源单据】=“实体银行”的凭证模板详情页面，修改【凭证类型取值来源】：——详见原型1</span></p><p style="font-size:18px;"><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">1.点击 查看/编辑，打开【凭证类型取值来源设置】弹窗，样式参考【来源单据】为“Amazon财务报表”的【凭证类型取值来源】；</span></p><p style="font-size:18px;"><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">2.点击【取值条件】 查看/编辑框，打开【凭证类型取值条件】弹窗，【影响因素】字段：单选，非必录，下拉选项包括：</span><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;color:rgba(184, 116, 26, 0.6705882352941176);">法人主体、单据类型</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"> （数据源均为【实体银行/财务EAS凭证】的对应字段）</span></p><p style="font-size:18px;"><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p>
