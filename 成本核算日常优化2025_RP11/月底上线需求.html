          <p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">需求2：国/境外FBA底稿需支持导入中东地区+AE站点仓库数据；</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">期初、期末（FBA）、销售出库、其他入库、其他出库、调拨页面【导入、下载导入模板】：导入时站点区域新增‘中东’（模板提示也加），对应站点缩写校验</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;color:#D9001B;">ME（20250903调整）</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">；</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">账号调整页面：【新增、修改】：站点区域下拉选项新增‘中东’；</span></p><p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;"><br></span></p>
