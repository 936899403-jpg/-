        <div id="u372_text" class="text ">
          <p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">1.【计算汇总数据】：</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">1.1弹窗新增【来源报表类型】：非必录，下拉多选，选项包括‘月度交易明细’和‘补录账单’； 确定后按所选维度进行计算汇总；</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">1.2汇总【来源报表类型】=‘补录账单’的数据时，新增【账单期间】维度，即根据【解析逻辑配置/汇总数据】所维护的业务类型 按照【入账期间+店铺+站点+部门+来源报表类型+</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;color:#D9001B;">账单期间</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">】维度汇总金额至【财务EAS凭证】中；</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">2.【导出】：</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">导出不同月份的文件需合并在同一张表内；</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">3.搜索框：</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">【入账期间】搜索框去除 ‘开始期间年份与结束期间年份一致’ 的限制；</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p>
