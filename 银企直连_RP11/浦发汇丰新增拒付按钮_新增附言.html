        <div id="u6288_text" class="text ">
          <p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">需求1：</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">浦发、汇丰银行【支付失败】页签新增【拒付】按钮：</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp;&nbsp; </span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp;&nbsp; 同 待支付 页面的【拒付】按钮。拒付成功后将数据转移至拒付页签；</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp;&nbsp; --注意费用报销完结审批流，费用报销状态为未通过，费用报销支付状态为已拒付</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">需求2：</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">【实体银行/银行账户管理/账单管理/账单详情】打印回单格式竖放居中调整；</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp;&nbsp; --原因：原先格式设置为A5横放打印，现在由于打印机问题财务需要竖放打印，导致打印内容偏上，装订后不方便查阅；</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p>
