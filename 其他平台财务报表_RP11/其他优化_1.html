          <p><span style="font-family:&quot;Arial Negreta&quot;, &quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:700;">1.【平台财务报表/账号管理/walmart、ebay、其他平台】：定时任务/手动新增：</span><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">通过【AccountID + 店铺简称】维度判断是否新增/更新改为【AccountID】维度；--原因：当前店铺简称若变更会同步新增一条数据，实际是同一个店铺不需要新增；</span></p><p><span style="font-family:&quot;Arial Negreta&quot;, &quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:700;"><br></span></p><p><span style="font-family:&quot;Arial Negreta&quot;, &quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:700;">2.【平台对账/对账平台（第三方卡）/对账】：</span><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">对账按钮：点击对账需先还原手工对账，再执行批量对账；---原因：当前出现财务手工对账与批量对账不一致的情况，现逻辑为先执行批量对账再还原手工对账，导致重新对账后未展示手工对账结果；需要调整</span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p>
