        <div id="u15_text" class="text ">
          <p><span style="font-family:&quot;Arial Negreta&quot;, &quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:700;">【境外成本核算佰易底稿/销售出库】：</span><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">原需求链接：https://codesign.qq.com/app/s/560075671693257&nbsp; &nbsp; v8.7.2 需求3</span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">跨法人转卖—清关主体卖出：【销售出库】所有定时任务（商品收发明细、品牌线下、其他平台订单、国内销售出库）+国内销售出库【推送佰易底稿】按钮拉取数据时新增以下判断：</span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">若【销售出库类型】=‘海外仓线下订单出库’则不走后续跨法人转卖逻辑（不更新销售出库类型，备注，不生成采购入库和销售出库数据）</span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p>
