          <p><span style="font-family:&quot;Arial Negreta&quot;, &quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:700;">【成本核算/财务EAS凭证/采购成本核算-汇总成本报表】：--红字为调整</span></p><p><span style="font-family:&quot;Arial Negreta&quot;, &quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:700;"><br></span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">特殊处理：当用户修改【单据类型】=跨法人转卖明细-内部交易采购入库-范泰克转卖给傲基国际&nbsp; 的【应付原币】金额后，需将更新后的【应付原币总计、应付本币总计】同步至对应【期间+法人编码】同维度【单据类型】=采购成本以及其他采购成本（单体）-范泰克转卖给傲基国际 的数据对应字段中，同时计算</span><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;color:#D9001B;">两个单据类型的</span><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">【成本金额总计】=【应付本币总计】-【财报头程成本金额总计】；</span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">--仅限修改同维度下两种单据类型【凭证状态】≠‘凭证生成成功’的数据；</span></p>
