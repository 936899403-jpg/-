          <p><span style="font-family:&quot;Arial Negreta&quot;, &quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:700;">【海外仓尾程/费用明细】：</span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">佰易推送费用明细&amp;【刷新基础数据】按钮逻辑：红字为调整，新增【佰易SKU】维度；其余逻辑不变</span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">其他账单新增匹配逻辑：在原逻辑前先执行下述逻辑：按照【期间+</span><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;color:#D9001B;">佰易SKU</span><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">+包裹编号】维度依次匹【基础数据/小组部门/订单费】当前期间及前5个月期间（月份由后向前）的对应销售小组，匹到则停止；</span></p>
