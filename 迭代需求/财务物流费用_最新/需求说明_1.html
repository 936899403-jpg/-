          <p style="font-size:20px;"><span style="font-family:&quot;Arial Negreta&quot;, &quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:700;color:#000000;">1.需求背景</span></p><p style="font-size:18px;"><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">1.1现状：当前财务手工对空运头程费用进行入账核算；</span></p><p style="font-size:18px;"><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p><p style="font-size:18px;"><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">1.2痛点：未存储空运头程数据，不方便溯源；基础数据未准确导入系统无法支撑后续头程成本核算；</span></p><p style="font-size:18px;"><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p><p style="font-size:18px;"><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p><p style="font-size:20px;"><span style="font-family:&quot;Arial Negreta&quot;, &quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:700;color:#000000;">2.需求方案</span></p><p style="font-size:18px;"><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">新增【财务物流费用/空运头程费】模块，支持财务手工将空运头程预估数据导入至系统并汇总推凭；</span></p><p style="font-size:18px;"><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p><p style="font-size:20px;"><span style="font-family:&quot;Arial Negreta&quot;, &quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:700;color:#000000;"><br></span></p><p style="font-size:20px;"><span style="font-family:&quot;Arial Negreta&quot;, &quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:700;color:#000000;">3.需求价值</span></p><p style="font-size:18px;"><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p><p style="font-size:18px;"><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;">通过系统完成每月空运头程预估费用的自动化入账核算，提升月结效率并为后续头程成本核算提供数据支撑；</span></p><p style="font-size:18px;"><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p><p style="font-size:18px;"><span style="font-family:&quot;Arial Normal&quot;, &quot;Arial&quot;, sans-serif;font-weight:400;"><br></span></p>
