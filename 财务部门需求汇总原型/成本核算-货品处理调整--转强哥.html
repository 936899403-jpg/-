        <div id="u6_text" class="text ">
          <p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">说明：</span></p><p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">&nbsp;现状：</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">针对佰易货品处理模块的数据，对接财务成本核算的时候，数据是同步到国外成本核算佰易底稿模块的其他出库模块，对应出库类型=滞销库存扣除库存</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">调整后：1.国外成本核算佰易底稿--销售出库模块，增加</span><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">“美国团队订单销售出库”</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">这个类型</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 2.数据源：佰易货品处理模块--订单类型=美国团队订单的数据，对应同步数据的逻辑同当前同步到其他出库的逻辑</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 3.数据处理：对应数据从其他出库切到销售出库，数据从6月份开始切，即上线后的次月，历史数据不能动</span></p>
