        <div id="u984_text" class="text ">
          <p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">说明：</span></p><p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;"><br></span></p><p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">整体说明：</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">针对美国子公司sku进行调整，&nbsp;&nbsp; 子公司sku的法人对应=NEXTFUR LLC</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">模块：</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">国外成本核算佰易底稿---采购入库/其他入库/调拨/其他出库/销售出库/转sku/期末(佰易)/期末（核算）</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">&nbsp;&nbsp; &nbsp; &nbsp; &nbsp;&nbsp; 国外成本核算FBA底稿----销售出库/其他入库/其他出库/调拨/匹配sku/期末（核算）</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p><p><span style="font-family:'Arial Negreta', 'Arial Normal', 'Arial', sans-serif;font-weight:700;">说明：</span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">以上模块的业务数据，涉及sku属性是美国子公司的话，则默认法人=NEXTFUR LLC</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;">&nbsp; </span><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;color:#D9001B;">注：主账号法人会变，每次取数用该取数时间对应的主账号法人信息</span></p><p><span style="font-family:'Arial Normal', 'Arial', sans-serif;font-weight:400;"><br></span></p>
